services:
  nginx:
    image: nginx:latest
    container_name: nginx_server
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"

  next-server:
    image: next:0.1
    container_name: anton_next_server
    ports:
      - "3000:3000"
    restart: unless-stopped
