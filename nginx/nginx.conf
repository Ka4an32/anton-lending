events {
    use           epoll;
    worker_connections  128;
}

http {
    include /etc/nginx/mime.types;

    server {
        listen       80;
        listen  [::]:80;
        server_name  localhost;

        location / {
            proxy_pass http://anton_next_server:3000;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
